[workspace]
resolver = "2"
members = [
    "crates/st-syntax",
    "crates/st-bytecode",
    "crates/st-heap",
    "crates/st-vm",
    "crates/st-cli",
    "crates/st-web",
]

[workspace.package]
version = "0.1.12"
authors = ["Sidakpreet Singh"]
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.98"

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
console_log = "=1.1.0"
env_logger = "=0.11.11"
js-sys = "=0.3.106"
libm = { version = "=0.2.16", default-features = false }
log = "=0.4.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
