[workspace]
resolver = "2"
members = [
    "crates/st-syntax",
    "crates/st-bytecode",
    "crates/st-heap",
    "crates/st-vm",
    "crates/st-cli",
    "crates/st-web",
]

[workspace.package]
version = "0.1.1"
authors = ["Sidakpreet Singh"]
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.83"

[workspace.dependencies]
clap = { version = "=4.5.23", features = ["derive"] }
console_log = "=1.0.0"
env_logger = "=0.11.6"
js-sys = "=0.3.76"
libm = { version = "=0.2.11", default-features = false }
log = "=0.4.22"
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.133"
thiserror = "=2.0.8"
wasm-bindgen = "=0.2.99"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
